org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric. The CI build looks up the newest loader, Yarn build,
# Fabric API and Loom for minecraft_version and overwrites the rest of these,
# so bumping minecraft_version is usually the only edit an update needs.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.17.3
loom_version=1.13.3
fabric_version=0.139.4+1.21.11

# Mod
mod_version=1.0.0
maven_group=com.pvpbot
archives_base_name=pvpbot-voicelink

# Dependencies
voicechat_api_version=2.6.24
vosk_version=0.3.45
