yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.18.2
fabric_version=0.141.6+1.21.11

# Mod
mod_version=1.0.0
maven_group=com.pvpbot
archives_base_name=pvpbot-voicelink

# Dependencies
voicechat_api_version=2.6.24
vosk_version=0.3.45
