name: Build jar & publish release

# Every push builds the plugin jar and publishes it as the newest GitHub
# release, so the latest change is always one download away.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect jar
        id: jar
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' build.gradle.kts | head -n1)
          mkdir -p dist
          # Ship the server-ready jar, not the -dev (unobfuscated dev bundle) one.
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev*' ! -name '*-sources*' -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PvPBot-${{ steps.jar.outputs.version }}-${{ steps.jar.outputs.short_sha }}
          path: dist/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.jar.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PvPBot ${{ steps.jar.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build of `${{ github.ref_name }}` @ ${{ steps.jar.outputs.short_sha }}.

            ${{ github.event.head_commit.message }}
          files: dist/*.jar
          make_latest: true
