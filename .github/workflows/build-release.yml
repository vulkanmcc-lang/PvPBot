name: Build jars & publish release

# Every push builds the Paper plugin (paper/) and the Fabric Voice Link mod
# (fabric/) and publishes both as the newest GitHub release.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper
    outputs:
      version: ${{ steps.jar.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect jar
        id: jar
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' build.gradle.kts | head -n1)
          mkdir -p ../dist
          # The reobf jar is the one servers run; skip the -dev bundle jars.
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev*' ! -name '*-sources*' -exec cp {} ../dist/ \;
          ls -l ../dist
          test -n "$(ls ../dist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: paper-jars
          path: dist/*.jar

  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4

      # Current Loom needs Gradle itself to run on Java 25; the mod is still
      # compiled for Java 21 (options.release), which is what 1.21.11 runs on.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Pin the newest loader / Yarn / Fabric API / Loom for minecraft_version
      # from Fabric's own metadata, so the mod always builds against a
      # matching, current toolchain.
      - name: Resolve Fabric versions
        run: |
          set -euo pipefail
          MC=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          YARN=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/yarn/$MC" \
            | python3 -c 'import sys,json; v=json.load(sys.stdin); print(max(v,key=lambda e:e["build"])["version"])')
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader \
            | python3 -c 'import sys,json; print(next(e["version"] for e in json.load(sys.stdin) if e["stable"]))')
          API=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | python3 -c 'import sys,re; mc=sys.argv[1]; vs=[v for v in re.findall(r"<version>([^<]+)</version>", sys.stdin.read()) if v.endswith("+"+mc)]; print(vs[-1])' "$MC")
          LOOM=$(curl -fsSL https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml \
            | python3 -c 'import sys,re; vs=[v for v in re.findall(r"<version>([^<]+)</version>", sys.stdin.read()) if re.fullmatch(r"\d+\.\d+\.\d+", v)]; vs.sort(key=lambda s: tuple(map(int, s.split(".")))); print(vs[-1])')
          echo "minecraft=$MC yarn=$YARN loader=$LOADER fabric-api=$API loom=$LOOM"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$API/; s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
          cat gradle.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect jar
        run: |
          mkdir -p ../dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources*' ! -name '*-dev*' -exec cp {} ../dist/ \;
          ls -l ../dist
          test -n "$(ls ../dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-jars
          path: dist/*.jar

  release:
    runs-on: ubuntu-latest
    needs: [paper, fabric]
    # Still ship the plugin if only the mod failed to build.
    if: always() && needs.paper.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        id: files
        run: |
          ls -l dist
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.paper.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PvPBot ${{ needs.paper.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build of `${{ github.ref_name }}` @ ${{ steps.files.outputs.short_sha }}.

            - **Server:** `PvPBot-*-reobf.jar` → Paper `plugins/`
            - **Client (optional):** `pvpbot-voicelink-*.jar` → Fabric `mods/` alongside Simple Voice Chat and Fabric API, for voice orders
            ${{ needs.fabric.result != 'success' && '- ⚠️ The Fabric mod failed to build in this run, so it is not attached.' || '' }}

            ${{ github.event.head_commit.message }}
          files: dist/*.jar
          make_latest: true
